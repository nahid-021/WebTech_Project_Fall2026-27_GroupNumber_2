
<!DOCTYPE html>
<html lang="en-US">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../ManagerDesign/manager-service-history.css">

    <title>BusSheba Manager Service History</title>

</head>

<body>


    
    <div class="topnav">

        <a href="" class="logo">🚌 BusSheba</a>

        <div class="nav-links">

            <a href="">Dashboard</a>

            <a href="">Parts</a>

            <a href="">Requests</a>

            <a href="" class="active">Services</a>

        </div>


        <div class="manager-profile">

            <span class="profile-icon">M</span>

            <div class="profile-info">

                <span class="manager-name">manager</span>

                <span class="manager-role">Manager</span>

            </div>

        </div>


        <button class="signout" id="signout">

            Sign out

        </button>

    </div>



    
    <div class="main-content">


        
        <div class="panel">

            <h3>Add Service Record</h3>


            <form id="serviceForm">


                
                <div class="form-row">


                    <div class="form-group">

                        <label for="bus">Bus</label>

                        <select id="bus" name="bus" required>

                            <option value="">— Select a bus —</option>

                            <option value="Green Line (DHAKA-BA-1234)">
                                Green Line (DHAKA-BA-1234)
                            </option>

                            <option value="Hanif Enterprise (DHAKA-BA-2001)">
                                Hanif Enterprise (DHAKA-BA-2001)
                            </option>

                        </select>

                    </div>



                    <div class="form-group">

                        <label for="serviceDate">Service Date</label>

                        <input
                            type="date"
                            id="serviceDate"
                            name="serviceDate"
                            required
                        >

                    </div>



                    <div class="form-group">

                        <label for="cost">Cost (৳)</label>

                        <input
                            type="number"
                            id="cost"
                            name="cost"
                            placeholder="0"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                </div>



                
                <div class="form-group">

                    <label for="workDone">Work Done</label>

                    <textarea
                        id="workDone"
                        name="workDone"
                        rows="4"
                        required
                    ></textarea>

                </div>



                
                <div class="form-group">

                    <label>Parts Used (optional, up to 3)</label>


                    
                    <div class="parts-row">

                        <select name="part1">

                            <option value="">— No part —</option>

                            <option value="Engine Oil">Engine Oil</option>

                            <option value="Brake Pad">Brake Pad</option>

                            <option value="Tire">Tire</option>

                            <option value="Air Filter">Air Filter</option>

                        </select>


                        <input
                            type="number"
                            name="quantity1"
                            placeholder="Quantity used"
                            min="1"
                        >

                    </div>



                    
                    <div class="parts-row">

                        <select name="part2">

                            <option value="">— No part —</option>

                            <option value="Engine Oil">Engine Oil</option>

                            <option value="Brake Pad">Brake Pad</option>

                            <option value="Tire">Tire</option>

                            <option value="Air Filter">Air Filter</option>

                        </select>


                        <input
                            type="number"
                            name="quantity2"
                            placeholder="Quantity used"
                            min="1"
                        >

                    </div>



                    
                    <div class="parts-row">

                        <select name="part3">

                            <option value="">— No part —</option>

                            <option value="Engine Oil">Engine Oil</option>

                            <option value="Brake Pad">Brake Pad</option>

                            <option value="Tire">Tire</option>

                            <option value="Air Filter">Air Filter</option>

                        </select>


                        <input
                            type="number"
                            name="quantity3"
                            placeholder="Quantity used"
                            min="1"
                        >

                    </div>


                </div>



                
                <button type="submit" class="submit-btn">

                    Add Service Record

                </button>


            </form>

        </div>




        
        <div class="panel">

            <h3>Service History</h3>



            
            <div class="search-box">

                <input
                    type="text"
                    id="searchService"
                    placeholder="Search by work done or bus number..."
                >

                <button type="button" class="search-btn">

                    Search

                </button>

            </div>



            
            <table>

                <thead>

                    <tr>

                        <th>Bus</th>

                        <th>Date</th>

                        <th>Work Done</th>

                        <th>Parts Used</th>

                        <th>Cost</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody id="serviceTable">

                    

                </tbody>


            </table>


            <p id="emptyMsg" class="empty"></p>


        </div>


    </div>




    
    <div class="footer">

        <h3>BusSheba</h3>

        <p>
            Online bus ticket booking and travel management system.
        </p>


        <div class="footer-links">

            <a href="">Home</a>

            <a href="">Bus Ratings</a>

            <a href="">Contact</a>

        </div>


        <p>
            © 2026 BusSheba — All rights reserved.
        </p>

    </div>



    
    <script src="../JavaScript/Manager-Service-History.js"></script>


</body>

</html>
