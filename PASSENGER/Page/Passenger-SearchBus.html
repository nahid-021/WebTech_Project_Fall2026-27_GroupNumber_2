<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../Design/Passenger-SearchBus.css">
    <title>Search Buses</title>
</head>
<body>

    <div class="topnav">
    <a href="" class="logo">
        <img src="../Assets/logo.jpg" alt="">
    </a>
    <a href="">Home</a>
    <a href="">Search Buses</a>
    <a href="">Previous Bookings</a>
    <a href="">Bus Ratings</a>
    <a href="">Reviews</a>

    <a href="" class="signout">Sign Out</a>

</div>

    <div class="header">
        <h2>Find your preffered Bus</h2>
        <p>Book Bus Tickets from us at Your Best Deal</p>
    </div>


<div class="bus-section">

    <div class="filter">

        <h3>Filters: </h3>

        <h4>Bus Type</h4>

        <input type="radio" id="all" name="bustype" checked>
        <label for="all">All</label>
        <br><br>

        <input type="radio" id="ac" name="bustype">
        <label for="ac">AC</label>
        <br><br>

        <input type="radio" id="nonac" name="bustype">
        <label for="nonac">Non-AC</label>

        <h4>Sort By</h4>

        <select name="sort">
            <option>Price: Low to High</option>
            <option>Price: High to Low</option>
        </select>

    </div>

<div class="available-buses">

        <h3>Available Buses</h3>

    </div>

        <div class="select">
<input type="button" class="select-button" value="Select">
    </div>

</div>

<div class="footer">
    <p class="copyright">&copy; 2026 BusSheba |</p>
    <p class="rights">All Rights Reserved.</p>
</div>

</body>
</html>
