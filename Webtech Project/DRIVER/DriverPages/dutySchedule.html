        <div class="container card">

        <h2>Add Schedule</h2>
        <form class = "schedule-form" action="" method="post">
            <label for = "date">Date</label>
            <input type = "date" id="date" name="date"class="schedule-input" required>

            <label for="status">Status</label>
            <select id="status" name="status"class="schedule-input" >
                <option>Available</option>
                <option>On Duty</option>
                <option>On leave</option>
            </select>

            <label for="note">Note</label>
            <input type="text" id="text"name="text"class="schedule-input">

            <button type="submit" class = "btn">ADD</button>
            </form>
        </div>

        <div class="container-card">
            <h2>Driver Schedule</h2>

            <div class="table-wrap">
                <table class="data-table">
                    
                        <tr>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Note</th>
                            <th>Action</th>
                        </tr>
                    
                </table>
            </div>
        </div>
