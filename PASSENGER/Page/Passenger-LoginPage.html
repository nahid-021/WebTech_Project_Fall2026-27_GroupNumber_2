<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../Design/Passenger-LoginPage.css">
     <script src="../JS/Passenger-LoginPage.js"></script>
    <title>Login</title>
</head>

<body>

    <div class="login-section">

        <img src="../Assets/logo.jpg" alt="BusSheba Logo" class="logo">

        <h2>BusSheba Login</h2>

        <form onsubmit="return collect_data()">

            <div class="login-form">

                <label for="username">Username</label>
                <input type="text" id="username" name="username">
                <p id="usernameError"></p>

                <label for="password">Password</label>
                <input type="password" id="password" name="password">
                <p id="passwordError"></p>

            </div>

            <input type="submit" class="login-button" value="Login">


            <div class="register">
                <p>Don't have an account?</p>
                <a href="Passenger-RegisterPage.html">Register</a>
            </div>

        </form>

    </div>

</body>

</html>
