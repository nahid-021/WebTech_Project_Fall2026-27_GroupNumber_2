<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <link rel = "stylesheet" href="../DriverDesign/driver.css">
        <title>"BusSheba-Login"</title>
        <script src = "../DriverJs/driver.js"></script>
    </head>

    <body>
        <div class = "login-container">
            <div class = "login-image">
            <img src = "../DriverAssest/loginImage.jpeg" class="background-image" alt="Bus background">
</div>
            <div class = "login">
                <h2>BusSheba</h2>
                <h1> Driver Login</h1>

                <p>
                    Welcome Back!Login to your Driver Account.
                </p>
                <form action="dashboard.html" onsubmit="return driverLogin()">

                
                <label for = "DriverID">Driver ID</label>
                <input type="text" id ="driverID" placeholder="Enter Driver ID" required>

                 <label for = "password">Password</label>
                <input type="password" id ="password" placeholder="Enter Password" required>
                <button type = "submit">Login</button>
                
                </form>
                <p class = "register-link">
                    Dont't have an account?
                    <a href = "Register.html">Registere Here</a>
                </p>
            </div>
        </div>
    </body>
